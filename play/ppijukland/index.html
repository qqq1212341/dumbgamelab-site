/** 주소 쿼리(또는 Play 설치 리퍼러 문자열)에서 친구 코드 — `utm_source=invite&utm_content=<코드>` 가 아니면 '' */

/**
 * 초대 한 벌을 만든다.
 * @param {object} o

 * @param {{get(k:string):string|null,set(k:string,v:string):void}} [o.storage]  기본 localStorage

        /* 옛 판에서 이미 넣은 코드는 서버에 관계가 없다 — 성사·환영 보상을 다시 주지 않는다 */

    /** 내 코드 — 처음 부르면 만든다. 서버 등록은 뒤에서(실패하면 다음에 또) */

     * 성사되면 환영 보상 한 번. 서버가 «아직 이르다»면 false — 다음 문턱·다음 실행에 또 부르면 된다.

    /** 내 코드의 성사 수를 읽고, 새로 성사된 만큼 friend 보상 → Promise<{confirmed, pending, fresh}> */
    sync: function () {

        const from = cur.rewarded;
        const to = Math.max(from, res.confirmed | 0);
        cur.rewarded = to;
        save(cur);
        for (let i = from + 1; i <= to; i++) give({ kind: 'friend', index: i, mult: inviteMult(i) });
        return { confirmed: to, pending: res.pending | 0, fresh: to - from };
      });
    },

    /** 받은 친구 수(보상 준 수) — 화면이 사다리를 그린다 */
    friends: function () { return load().rewarded; },

    /** 보상 콜백을 나중에 꽂는다 — 그동안 쌓인 보상을 바로 준다 */
    setRewardHandler: function (fn) {

    linkQuery: function () {

    },
  };
  return api;
}
