<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>내 안의 어른 vs 어린이 비율 / 心の中の大人と子どもの比重</title>
<meta name="description" content="10문제, 1분. 내 안의 어른과 어린이가 몇 대 몇인지 잰다. / 10問・1分。心の中の大人と子どもの比重を測る。">
<meta property="og:title" content="내 안의 어른 vs 어린이 비율 / 心の中の大人と子どもの比重">
<meta property="og:description" content="10문제, 1분. 결과는 사람마다 다르다. / 10問・1分。結果は人それぞれ。">
<meta property="og:image" content="https://dumbgamelab.com/play/heart-ratio/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff4e0">
<link rel="icon" href="data:,">
<script src="js/analytics.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#fff4e0;color:#2b2118;font-family:-apple-system,"Apple SD Gothic Neo","Hiragino Sans","Noto Sans KR","Noto Sans JP","Malgun Gothic",sans-serif}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;padding:max(18px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;overflow:hidden}
.lang{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;font-size:13px;font-weight:700;color:#8a6f52;background:#ffe6bd;border:0;border-radius:14px;padding:8px 12px;min-height:36px}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
h1{font-size:30px;line-height:1.25;margin:56px 0 10px;font-weight:900;letter-spacing:-.5px}
h1 em{font-style:normal;color:#e8542f}
.sub{font-size:16px;line-height:1.5;color:#6d5a46;margin:0}
.versus{display:flex;align-items:center;justify-content:center;gap:14px;margin:auto 0;font-weight:900;font-size:22px}
.badge{width:116px;height:116px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;text-align:center;line-height:1.2}
.badge.a{background:#3b4a63;transform:rotate(-4deg)}
.badge.c{background:#f2b632;color:#4a3300;transform:rotate(4deg)}
.btn{width:100%;min-height:60px;border:0;border-radius:20px;font-size:19px;font-weight:800;color:#fff;background:#e8542f;box-shadow:0 5px 0 #b63a1a;padding:14px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b63a1a}
.btn.sec{background:#fff;color:#2b2118;box-shadow:0 5px 0 #e0cfb4;border:2px solid #ecdcc0}
.btn.sec:active{box-shadow:0 1px 0 #e0cfb4}
.note{text-align:center;color:#8a6f52;font-size:13px;margin:12px 0 0}
.top{display:flex;align-items:center;gap:10px;margin-top:44px}
.count{font-size:15px;font-weight:800;color:#8a6f52;min-width:48px}
.timer{flex:1;height:12px;border-radius:6px;background:#ecdcc0;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:#e8542f;transform-origin:left}
.q{font-size:25px;line-height:1.4;font-weight:900;margin:auto 0;letter-spacing:-.3px;word-break:keep-all}
.q small{display:block;font-size:14px;font-weight:700;color:#8a6f52;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.opt{width:100%;min-height:84px;border:2px solid #ecdcc0;border-radius:22px;background:#fff;font-size:18px;line-height:1.4;font-weight:700;color:#2b2118;padding:14px 18px;text-align:left;box-shadow:0 5px 0 #e0cfb4;word-break:keep-all}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #e0cfb4;background:#fff7e8}
.card{margin:auto 0;background:#fff;border-radius:28px;padding:24px 22px 22px;border:2px solid #ecdcc0;box-shadow:0 6px 0 #e0cfb4}
.card .k{font-size:13px;font-weight:800;color:#8a6f52}
.card .t{font-size:28px;font-weight:900;line-height:1.25;margin:6px 0 14px;color:#e8542f;word-break:keep-all}
.nums{display:flex;justify-content:space-between;font-weight:900;font-size:26px;margin-bottom:8px}
.nums span small{display:block;font-size:12px;font-weight:700;color:#8a6f52}
.nums .r{text-align:right}
.bar{height:26px;border-radius:13px;overflow:hidden;display:flex;background:#f2b632}
.bar i{display:block;height:100%;background:#3b4a63;width:50%;transition:width .9s cubic-bezier(.2,.9,.3,1)}
.desc{font-size:16px;line-height:1.6;color:#4a3b2a;margin:16px 0 0;word-break:keep-all}
.brand{font-size:12px;color:#b39a7a;margin-top:14px;text-align:right}
.acts{margin-top:0;display:flex;flex-direction:column;gap:12px;padding-top:16px}
html[lang=ja] .opt,html[lang=ja] .q,html[lang=ja] .desc,html[lang=ja] .card .t,html[lang=ja] h1{word-break:normal;line-break:strict;overflow-wrap:anywhere}
.opt{text-align:left}
</style>
</head>
<body>
<div id="app">
  <button class="lang" id="lang" type="button">日本語</button>

  <section class="screen on" id="s-start">
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
    <div class="versus"><div class="badge a" id="b-a"></div><span>VS</span><div class="badge c" id="b-c"></div></div>
    <button class="btn" id="go" type="button"></button>
    <p class="note" id="t-note"></p>
  </section>

  <section class="screen" id="s-play">
    <div class="top"><span class="count" id="count"></span><div class="timer"><i id="bar"></i></div></div>
    <div class="q"><small id="q-hint"></small><span id="q-text"></span></div>
    <div class="opts">
      <button class="opt" id="o0" type="button"></button>
      <button class="opt" id="o1" type="button"></button>
    </div>
  </section>

  <section class="screen" id="s-result">
    <div class="card">
      <div class="k" id="r-k"></div>
      <div class="t" id="r-type"></div>
      <div class="nums"><span id="r-a"></span><span class="r" id="r-c"></span></div>
      <div class="bar"><i id="r-bar"></i></div>
      <p class="desc" id="r-desc"></p>
      <div class="brand">dumbgamelab.com</div>
    </div>
    <div class="acts">
      <button class="btn" id="copy" type="button"></button>
      <button class="btn sec" id="again" type="button"></button>
    </div>
  </section>
</div>
<script src="js/game.js"></script>
</body>
</html>
