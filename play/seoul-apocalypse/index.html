<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서울 아포칼립스 — 1서버 닉네임 선점</title>
<meta name="description" content="좀비가 휩쓴 서울, 내 아파트 단지부터 지킨다. 1서버 닉네임을 먼저 잡아 두세요.">
<link rel="canonical" href="https://dumbgamelab.com/play/seoul-apocalypse/">
<meta property="og:type" content="website">
<meta property="og:title" content="서울 아포칼립스 — 1서버 닉네임 선점">
<meta property="og:description" content="좀비가 휩쓴 서울, 내 아파트 단지부터 지킨다.">
<meta property="og:image" content="https://dumbgamelab.com/play/seoul-apocalypse/og.jpg">
<meta property="og:url" content="https://dumbgamelab.com/play/seoul-apocalypse/">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="/img/logo.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-07GYE9HE5C"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-07GYE9HE5C');</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0b0f1a;color:#f3efe4;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.hero{position:relative;height:min(112vw,520px);background:#141a2b url(hero.jpg) center top/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,26,.55) 0,rgba(11,15,26,0) 22%,rgba(11,15,26,0) 52%,#0b0f1a 100%)}
.brand{position:absolute;z-index:2;top:max(14px,env(safe-area-inset-top));left:16px;font-weight:800;font-size:15px;letter-spacing:.02em;color:#ffd77a;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hook{position:absolute;z-index:2;left:18px;right:18px;bottom:6px;margin:0;font-size:29px;line-height:1.22;font-weight:900;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.85)}
.hook b{color:#ffd77a;font-weight:900}
.card{margin:6px 16px 0;padding:18px 16px 16px;border-radius:18px;background:linear-gradient(180deg,#1b2440,#131a30);border:1px solid #2c3963;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.count{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px;font-size:14px;color:#aab3d1}
.count strong{font-size:26px;color:#ffd77a;font-variant-numeric:tabular-nums;font-weight:900}
label{display:block;font-size:13px;color:#aab3d1;margin:12px 0 6px}
input[type=text],input[type=email]{width:100%;height:52px;padding:0 14px;border-radius:12px;border:1.5px solid #36446f;background:#0d1326;color:#fff;font-size:17px;font-family:inherit;outline:none;-webkit-user-select:text;user-select:text}
input:focus{border-color:#ffc94d}
.hint{min-height:20px;margin:6px 2px 0;font-size:13px;color:#ff8f7a}
button.cta{width:100%;height:58px;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffd35c,#f0a21a);color:#2a1a00;font-size:19px;font-weight:900;font-family:inherit;box-shadow:0 4px 0 #a96b05,0 10px 20px rgba(240,162,26,.25);touch-action:manipulation;-webkit-user-select:none;user-select:none}
button.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #a96b05}
button.cta[disabled]{opacity:.6}
.note{margin:12px 2px 0;font-size:12px;line-height:1.5;color:#7f89ab}
.note a{color:#a9b5dd}
.done{display:none;text-align:center;padding:6px 0 2px}
.done .big{font-size:26px;font-weight:900;color:#ffd77a;margin:4px 0 6px;word-break:break-all}
.done .sub{color:#c9d1ee;font-size:15px;margin:0 0 14px}
button.ghost{width:100%;height:50px;border-radius:12px;border:1.5px solid #4a5a8f;background:transparent;color:#e7ebff;font-size:16px;font-weight:700;font-family:inherit;touch-action:manipulation}
.perks{list-style:none;margin:18px 16px 0;padding:0;display:grid;gap:8px}
.perks li{padding:13px 14px;border-radius:12px;background:#121a2e;border:1px solid #232e50;font-size:15px;font-weight:700;color:#e7ebff;-webkit-user-select:none;user-select:none}
.perks li span{display:block;margin-top:2px;font-size:13px;font-weight:500;color:#8f9ac0}
.foot{margin:18px 18px 0;font-size:12px;line-height:1.5;color:#6c7699;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">서울 아포칼립스</div>
    <h1 class="hook">좀비가 휩쓴 서울,<br><b>내 아파트 단지</b>부터 지킨다</h1>
  </header>

  <section class="card" id="card">
    <form id="f" autocomplete="off" novalidate>
      <p class="count"><span>1서버 닉네임 선점</span><strong id="cnt">-</strong></p>
      <label for="nick">닉네임</label>
      <input id="nick" type="text" name="nick" maxlength="10" placeholder="한글·영문·숫자 2~10자" enterkeyhint="next" autocapitalize="off" spellcheck="false">
      <label for="mail">출시 알림 받을 이메일 (선택)</label>
      <input id="mail" type="email" name="email" maxlength="120" placeholder="example@email.com" inputmode="email" autocapitalize="off" enterkeyhint="done">
      <p class="hint" id="hint" role="alert"></p>
      <button class="cta" id="go" type="submit">1서버 닉 선점</button>
      <p class="note">이메일은 출시 알림에만 쓰고 출시 30일 뒤 지웁니다. 선점하면 동의한 것으로 봅니다. <a href="/ko/privacy/#prereg">개인정보처리방침</a></p>
    </form>
    <div class="done" id="done">
      <p class="sub">선점 완료</p>
      <p class="big" id="mine"></p>
      <p class="sub" id="rank"></p>
      <button class="ghost" id="share" type="button">친구도 닉 선점하게 링크 보내기</button>
    </div>
  </section>

  <ul class="perks">
    <li>출시 때 이 닉으로 시작<span>다른 사람은 못 씁니다</span></li>
    <li>단지 · 연맹 · 서버 전쟁<span>좀비 사태 뒤 서울을 4X 전략으로</span></li>
  </ul>
  <p class="foot">개발 중인 게임입니다. 출시가 취소되면 닉네임과 이메일은 모두 지웁니다.<br>덤게임랩</p>
</div>

<script>
(function(){
  var API='https://seoulapoc-prereg.iap-validator.workers.dev';
  var q=new URLSearchParams(location.search);
  var utm=(q.get('utm_source')||document.referrer.replace(/^https?:\/\/([^\/]+).*/,'$1')||'direct').slice(0,40);
  var ref=(q.get('ref')||'').slice(0,40);
  function ev(n,p){try{gtag('event',n,Object.assign({game:'seoul-apocalypse',utm_source:utm},p||{}));}catch(e){}}
  var $=function(i){return document.getElementById(i)};
  var started=false,busy=false;
  ev('prereg_view');
  try{var mine=localStorage.getItem('seoulapoc.nick'); if(mine) showDone(mine,localStorage.getItem('seoulapoc.rank'));}catch(e){}

  fetch(API+'/count').then(function(r){return r.json()}).then(function(j){$('cnt').textContent=Number(j.total).toLocaleString('ko-KR')+'명'}).catch(function(){$('cnt').textContent=''});

  function start(){ if(!started){started=true;ev('prereg_start');} }
  $('nick').addEventListener('focus',start); $('nick').addEventListener('input',start);

  var MSG={nick_format:'닉네임은 한글·영문·숫자 2~10자예요.',nick_reserved:'쓸 수 없는 닉네임이에요.',taken:'이미 선점된 닉네임이에요.',email_format:'이메일 주소를 확인해 주세요.',limit:'오늘은 더 선점할 수 없어요.',server:'잠시 뒤에 다시 눌러 주세요.',origin:'잠시 뒤에 다시 눌러 주세요.'};
  function showDone(n,r){
    $('f').style.display='none'; $('done').style.display='block';
    $('mine').textContent=n; $('rank').textContent=r?('1서버 '+Number(r).toLocaleString('ko-KR')+'번째 선점'):'1서버 선점';
  }
  $('f').addEventListener('submit',function(e){
    e.preventDefault(); if(busy) return;
    var nick=$('nick').value.trim(), mail=$('mail').value.trim();
    $('hint').textContent='';
    if(!/^[가-힣A-Za-z0-9]{2,10}$/.test(nick)){$('hint').textContent=MSG.nick_format;return;}
    busy=true; $('go').disabled=true;
    fetch(API+'/reserve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nick:nick,email:mail,utm_source:utm,ref:ref})})
      .then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})})
      .then(function(o){
        if(o.j.ok){
          ev('prereg_done',{has_email:mail?1:0,rank:o.j.rank});
          try{localStorage.setItem('seoulapoc.nick',o.j.nick);localStorage.setItem('seoulapoc.rank',o.j.rank);}catch(e){}
          $('cnt').textContent=Number(o.j.total).toLocaleString('ko-KR')+'명';
          showDone(o.j.nick,o.j.rank);
        }else{
          ev('prereg_fail',{reason:o.j.error});
          $('hint').textContent=MSG[o.j.error]||MSG.server;
        }
      })
      .catch(function(){ev('prereg_fail',{reason:'network'});$('hint').textContent=MSG.server;})
      .then(function(){busy=false;$('go').disabled=false;});
  });
  $('share').addEventListener('click',function(){
    var u='https://dumbgamelab.com/play/seoul-apocalypse/?utm_source=share&ref='+encodeURIComponent((localStorage.getItem('seoulapoc.nick')||'').slice(0,20));
    ev('prereg_share');
    if(navigator.share){navigator.share({title:'서울 아포칼립스 — 1서버 닉네임 선점',url:u}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){$('share').textContent='링크를 복사했어요';});}
  });
})();
</script>
</body>
</html>
