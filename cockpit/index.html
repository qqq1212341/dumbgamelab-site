<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>DGL 조종석 연결</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F1420;color:#E8ECF4;font:17px/1.5 -apple-system,system-ui,sans-serif}
main{padding:32px;max-width:360px;text-align:center}
h1{font-size:22px;margin:0 0 8px}
p{color:#8A93A6;margin:0 0 28px}
a.btn{display:block;padding:16px;border-radius:14px;background:#3D7BFF;color:#fff;text-decoration:none;font-weight:700}
.bad{color:#FF8A8A}
</style></head>
<body><main>
<h1>DGL 조종석 연결</h1>
<p id="msg">앱을 먼저 설치한 뒤 아래 버튼을 누르세요.</p>
<a class="btn" id="go" href="#">조종석 앱에서 열기</a>
</main>
<script>
// 연결 값은 주소의 # 뒤에만 있다 — # 뒤는 서버로 가지 않는다(이 페이지는 아무것도 저장·전송하지 않는다).
var m = location.hash.match(/offer=([0-9A-Za-z_=.-]+)/);
var go = document.getElementById('go');
if (m) { go.href = 'dgl:///#offer=' + m[1]; }
else { document.getElementById('msg').textContent = '연결 링크가 잘못됐습니다. 받은 링크를 그대로 눌러 주세요.'; document.getElementById('msg').className = 'bad'; go.style.display = 'none'; }
</script>
</body></html>
